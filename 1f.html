<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1階プレス機 - プレス機 R1-R4</title>
    <meta name="description" content="1階プレス機（R1-R4）の日報管理アプリ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="1f-style.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>

<body>
    <div class="app-wrapper">
        <!-- Sidebar Menu -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="メニューを閉じる">✕</button>
            <div class="sidebar-header">
                <div class="logo-section">
                    <h1 style="font-size: 1.5rem;">管理システム</h1>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">日報管理</div>
                <nav class="sidebar-nav">
                    <a href="1f.html" class="nav-item active">
                        <span class="nav-icon">・</span>
                        1階プレス機
                    </a>
                    <a href="1f-kenpin.html" class="nav-item">
                        <span class="nav-icon">・</span>
                        1階検品機
                    </a>
                    <a href="index.html?view=day" class="nav-item">
                        <span class="nav-icon">・</span>
                        2階製造
                    </a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">在庫管理</div>
                <nav class="sidebar-nav">
                    <a href="index.html?view=stock" class="nav-item">
                        <span class="nav-icon">・</span>
                        ロール在庫
                    </a>
                    <a href="index.html?view=sliver" class="nav-item">
                        <span class="nav-icon">・</span>
                        スライバー在庫
                    </a>
                    <a href="index.html?view=hanapon" class="nav-item">
                        <span class="nav-icon">・</span>
                        鼻ぽん在庫
                    </a>
                    <a href="index.html?view=snowsprint" class="nav-item">
                        <span class="nav-icon">・</span>
                        スノースプリント資材
                    </a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">シフト管理</div>
                <nav class="sidebar-nav">
                    <a href="index.html?view=shift" class="nav-item">
                        <span class="nav-icon">・</span>
                        シフト表
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Content -->
        <div class="main-container">
            <header>
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <button class="hamburger-btn" id="hamburger-btn" aria-label="メニューを開く">☰</button>
                    <div class="logo-section">
                        <h1>1階プレス機 <span style="font-weight:300; opacity:0.7">Press Machine Log</span></h1>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="view-toggle">
                        <button id="view-day" class="toggle-btn active">日別</button>
                        <button id="view-month" class="toggle-btn">月別集計</button>
                    </div>
                    <div class="date-selector">
                        <input type="date" id="current-date-picker">
                    </div>
                </div>
            </header>

            <div id="day-view-container">
                <!-- Records Table -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="table-container">
                        <table id="records-table-1f">
                            <thead>
                                <tr>
                                    <th>機械</th>
                                    <th>開始時間</th>
                                    <th>終了時間</th>
                                    <th>稼働時間</th>
                                    <th>カウント/日</th>
                                    <th>カウントTOTAL</th>
                                    <th>備考</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="records-list-1f"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Navigation and Summary -->
                <div
                    style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;">
                    <div class="card"
                        style="margin: 0; padding: 1.25rem 1.5rem; flex: 1; min-width: 300px; background: linear-gradient(135deg, var(--bg-card) 0%, rgba(99, 102, 241, 0.05) 100%); border-left: 4px solid var(--primary);">
                        <div style="display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;">
                            <div>
                                <div
                                    style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-bottom: 0.25rem;">
                                    🏆 R1~R4の総プレス数/日</div>
                                <div id="grand-total-display-1f"
                                    style="font-size: 2.25rem; font-weight: 800; color: var(--primary); font-family: 'Outfit', sans-serif; line-height: 1;">
                                    0</div>
                            </div>
                            <div style="border-left: 1px solid var(--border); padding-left: 2rem;">
                                <div
                                    style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-bottom: 0.25rem;">
                                    📅 今月の月産累計</div>
                                <div id="monthly-grand-total-1f"
                                    style="font-size: 1.75rem; font-weight: 800; color: var(--accent); font-family: 'Outfit', sans-serif; line-height: 1;">
                                    0</div>
                            </div>
                        </div>
                        <!-- Individual Machine Stats Grid -->
                        <div id="machine-stats-grid-1f"
                            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin-top: 1.25rem; border-top: 1px dashed var(--border); padding-top: 1rem;">
                            <!-- Generated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Quick Entry -->
                <div class="card quick-entry-container">
                    <div class="quick-entry-header">
                        <div>
                            <h2 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 0.25rem;">📝 記録を追加</h2>
                            <p style="font-size: 0.875rem; color: var(--text-muted);">新しいプレス機稼働記録を追加します。</p>
                        </div>

                        <div class="quick-entry-stats">
                            <div style="text-align: right; min-width: 80px;">
                                <div
                                    style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">
                                    本日の合計</div>
                                <div id="day-total-count-1f"
                                    style="font-size: 1.75rem; font-weight: 800; color: var(--primary);">0</div>
                            </div>
                            <div style="text-align: right; min-width: 100px;">
                                <div
                                    style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">
                                    平均稼働時間</div>
                                <div id="avg-duration-1f"
                                    style="font-size: 1.75rem; font-weight: 800; color: var(--primary);">
                                    0h 00m</div>
                            </div>
                        </div>
                    </div>

                    <form id="entry-form-1f" class="quick-entry-form">
                        <div class="form-group small">
                            <label>機械</label>
                            <select id="machine-1f" required>
                                <option value="R1">R1</option>
                                <option value="R2">R2</option>
                                <option value="R3">R3</option>
                                <option value="R4">R4</option>
                            </select>
                        </div>
                        <div class="form-group small">
                            <label>開始時間</label>
                            <input type="time" id="start-time-1f" value="08:45" required>
                        </div>
                        <div class="form-group small">
                            <label>終了時間</label>
                            <input type="time" id="end-time-1f" value="17:00">
                        </div>
                        <div class="form-group">
                            <label>カウント</label>
                            <input type="number" id="count-1f" placeholder="">
                        </div>
                        <div class="form-group">
                            <label>備考</label>
                            <input type="text" id="notes-1f" placeholder="">
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 1.25rem;">追加</button>
                    </form>
                </div>
            </div>

            <!-- Monthly View Section -->
            <div id="month-view-container">
                <div class="month-summary-grid">
                    <div class="card">
                        <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;">📊 機械別月間カウント</h3>
                        <div id="monthly-machine-list">
                        </div>
                    </div>
                    <div class="card">
                        <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;">📈 月間サマリー</h3>
                        <div id="monthly-stats-overview-1f"></div>
                    </div>
                </div>

                <!-- Daily breakdown table -->
                <div class="card" style="margin-top: 1.5rem;">
                    <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;">📅 日別詳細</h3>
                    <div class="table-container">
                        <table class="month-table">
                            <thead>
                                <tr>
                                    <th>日付</th>
                                    <th>機械</th>
                                    <th>開始</th>
                                    <th>終了</th>
                                    <th>稼働</th>
                                    <th style="text-align: right;">カウント</th>
                                    <th>備考</th>
                                </tr>
                            </thead>
                            <tbody id="monthly-daily-list-1f"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="1f-app.js"></script>
</body>


</html>
