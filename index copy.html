<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滅菌紙ロール在庫表</title>
    <meta name="description" content="滅菌紙ロール在庫管理アプリケーション - フィルム・無地・EOGの在庫を日別に管理">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-left">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                            <line x1="12" y1="22.08" x2="12" y2="12" />
                        </svg>
                    </div>
                    <div>
                        <h1>滅菌紙ロール在庫表</h1>
                        <p class="header-subtitle">在庫管理システム</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="month-selector" id="monthSelector">
                        <button class="nav-btn" id="prevMonth" title="前月">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6" />
                            </svg>
                        </button>
                        <div class="month-display">
                            <select id="yearSelect" class="year-select"></select>
                            <span class="month-separator">年</span>
                            <select id="monthSelect" class="month-select"></select>
                            <span class="month-separator">月</span>
                        </div>
                        <button class="nav-btn" id="nextMonth" title="次月">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>


        <!-- Inventory Table -->
        <section class="table-section">
            <div class="table-container">
                <table class="inventory-table" id="inventoryTable">
                    <thead>
                        <tr class="header-main">
                            <th rowspan="2" class="date-col">日付</th>
                            <th colspan="3" class="group-film">フィルム</th>
                            <th colspan="3" class="group-plain">無地</th>
                            <th colspan="3" class="group-eog">EOG</th>
                        </tr>
                        <tr class="header-sub">
                            <th class="sub-film">配達</th>
                            <th class="sub-film">製造</th>
                            <th class="sub-film remaining">残</th>
                            <th class="sub-plain">配達</th>
                            <th class="sub-plain">製造</th>
                            <th class="sub-plain remaining">残</th>
                            <th class="sub-eog">配達</th>
                            <th class="sub-eog">製造</th>
                            <th class="sub-eog remaining">残</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                        <!-- Dynamic rows inserted here -->
                    </tbody>
                    <tfoot id="inventoryFoot">
                        <!-- Totals row inserted here -->
                    </tfoot>
                </table>
            </div>
        </section>

        <!-- Summary Cards -->
        <section class="summary-section" id="summarySection">
            <div class="summary-card film-card" id="filmCard">
                <div class="card-header">
                    <div class="card-icon film-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" />
                            <line x1="7" y1="2" x2="7" y2="22" />
                            <line x1="17" y1="2" x2="17" y2="22" />
                            <line x1="2" y1="12" x2="22" y2="12" />
                            <line x1="2" y1="7" x2="7" y2="7" />
                            <line x1="2" y1="17" x2="7" y2="17" />
                            <line x1="17" y1="7" x2="22" y2="7" />
                            <line x1="17" y1="17" x2="22" y2="17" />
                        </svg>
                    </div>
                    <h3>フィルム</h3>
                </div>
                <div class="card-body">
                    <div class="stat">
                        <span class="stat-label">繰越</span>
                        <span class="stat-value" id="filmCarryover">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">現在庫</span>
                        <span class="stat-value highlight" id="filmCurrent">0</span>
                    </div>
                    <div class="stat-row">
                        <div class="stat-mini">
                            <span class="stat-label-sm">配達計</span>
                            <span class="stat-value-sm" id="filmDeliveryTotal">0</span>
                        </div>
                        <div class="stat-mini">
                            <span class="stat-label-sm">製造計</span>
                            <span class="stat-value-sm" id="filmProductionTotal">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="summary-card plain-card" id="plainCard">
                <div class="card-header">
                    <div class="card-icon plain-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                        </svg>
                    </div>
                    <h3>無地</h3>
                </div>
                <div class="card-body">
                    <div class="stat">
                        <span class="stat-label">繰越</span>
                        <span class="stat-value" id="plainCarryover">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">現在庫</span>
                        <span class="stat-value highlight" id="plainCurrent">0</span>
                    </div>
                    <div class="stat-row">
                        <div class="stat-mini">
                            <span class="stat-label-sm">配達計</span>
                            <span class="stat-value-sm" id="plainDeliveryTotal">0</span>
                        </div>
                        <div class="stat-mini">
                            <span class="stat-label-sm">製造計</span>
                            <span class="stat-value-sm" id="plainProductionTotal">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="summary-card eog-card" id="eogCard">
                <div class="card-header">
                    <div class="card-icon eog-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="2" y1="12" x2="22" y2="12" />
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                        </svg>
                    </div>
                    <h3>EOG</h3>
                </div>
                <div class="card-body">
                    <div class="stat">
                        <span class="stat-label">繰越</span>
                        <span class="stat-value" id="eogCarryover">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">現在庫</span>
                        <span class="stat-value highlight" id="eogCurrent">0</span>
                    </div>
                    <div class="stat-row">
                        <div class="stat-mini">
                            <span class="stat-label-sm">配達計</span>
                            <span class="stat-value-sm" id="eogDeliveryTotal">0</span>
                        </div>
                        <div class="stat-mini">
                            <span class="stat-label-sm">製造計</span>
                            <span class="stat-value-sm" id="eogProductionTotal">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Action Bar -->
        <div class="action-bar">
            <div class="action-left">
                <button class="btn btn-primary" id="saveBtn" title="変更を保存">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    保存
                </button>
                <button class="btn btn-secondary" id="resetBtn" title="データをリセット">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10" />
                        <polyline points="23 20 23 14 17 14" />
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
                    </svg>
                    リセット
                </button>
            </div>
            <div class="action-right">
                <span class="save-status" id="saveStatus"></span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>© 2026 滅菌紙ロール在庫管理システム</p>
        </footer>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>

</html>
